name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    name: python-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Compile Python files
        run: python -m compileall skills tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Reject legacy brand strings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          forbidden = ["uo" + "uo", "uo" + "uo.cloud", "UO" + "UO_", "azure-" + "gpt-image-2"]
          excluded = {".git", "__pycache__"}
          matches = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or excluded.intersection(path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for value in forbidden:
                  if value.lower() in text.lower():
                      matches.append(f"{path}: {value}")
          if matches:
              raise SystemExit("\n".join(matches))
          print("legacy brand scan passed")
          PY

  distribution:
    name: distribution
    needs: python-tests
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22.20.0"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install and update for Codex and Claude Code
        shell: bash
        run: |
          set -euo pipefail
          for agent in codex claude-code; do
            project="$RUNNER_TEMP/local-${agent}-project"
            mkdir -p "$project"
            cd "$project"
            npx --yes skills@1.5.19 add "$GITHUB_WORKSPACE" \
              --skill supertoken-gpt-image-2 \
              --agent "$agent" \
              --yes
            npx --yes skills@1.5.19 list --json | tee skills-list.json
            AGENT="$agent" PROJECT_DIR="$project" python - <<'PY'
          import json
          import os
          from pathlib import Path

          listed = json.loads(Path("skills-list.json").read_text(encoding="utf-8"))
          matches = [item for item in listed if item["name"] == "supertoken-gpt-image-2"]
          assert len(matches) == 1, listed
          expected_root = ".agents" if os.environ["AGENT"] == "codex" else ".claude"
          expected = (
              Path(os.environ["PROJECT_DIR"])
              / expected_root
              / "skills"
              / "supertoken-gpt-image-2"
          )
          assert Path(matches[0]["path"]).resolve() == expected.resolve(), matches[0]
          assert (expected / "SKILL.md").is_file(), expected
          lock = json.loads(Path("skills-lock.json").read_text(encoding="utf-8"))
          entry = lock["skills"]["supertoken-gpt-image-2"]
          assert entry["sourceType"] == "local", entry
          PY
          if [[ "$agent" == "codex" ]]; then
            expected="$project/.agents/skills/supertoken-gpt-image-2"
          else
            expected="$project/.claude/skills/supertoken-gpt-image-2"
          fi
          test -f "$expected/scripts/supertoken_image.py"
          test -f "$expected/scripts/supertoken_api.py"
          test -f "$expected/references/gpt-image-2-api.md"
          python "$expected/scripts/supertoken_image.py" --help
          python "$expected/scripts/supertoken_image.py" generate --help
          python "$expected/scripts/supertoken_image.py" edit --help
          python "$expected/scripts/supertoken_image.py" wait --help
          done
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            for profile in codex shared; do
              project="$RUNNER_TEMP/remote-${profile}-project"
              mkdir -p "$project"
              agents=(codex)
              if [[ "$profile" == "shared" ]]; then
                agents=(codex claude-code)
              fi
              cd "$project"
              npx --yes skills@1.5.19 add "supertoken2026/skills#main" \
                --skill supertoken-gpt-image-2 \
                --agent "${agents[@]}" \
                --yes
              npx --yes skills@1.5.19 list --json > skills-list.json
              python - <<'PY'
          import json
          from pathlib import Path

          listed = json.loads(Path("skills-list.json").read_text(encoding="utf-8"))
          assert any(item["name"] == "supertoken-gpt-image-2" for item in listed), listed
          lock = json.loads(Path("skills-lock.json").read_text(encoding="utf-8"))
          entry = lock["skills"]["supertoken-gpt-image-2"]
          assert entry["source"] == "supertoken2026/skills", entry
          assert entry["sourceType"] == "github", entry
          assert entry["ref"] == "main", entry
          assert entry["skillPath"] == "skills/supertoken-gpt-image-2/SKILL.md", entry
          PY
              skill_dir="$(python - <<'PY'
          import json
          from pathlib import Path

          listed = json.loads(Path("skills-list.json").read_text(encoding="utf-8"))
          matches = [item for item in listed if item["name"] == "supertoken-gpt-image-2"]
          assert len(matches) == 1, listed
          print(Path(matches[0]["path"]).resolve())
          PY
              )"
              skill_file="$skill_dir/SKILL.md"
              test -f "$skill_file"
              if [[ "$profile" == "shared" ]]; then
                claude_dir="$project/.claude/skills/supertoken-gpt-image-2"
                test -L "$claude_dir"
                test "$(realpath "$claude_dir")" = "$skill_dir"
              fi
              before="$(sha256sum "$skill_file" | cut -d ' ' -f 1)"
              printf '\n<!-- update-smoke -->\n' >> "$skill_file"
              mutated="$(sha256sum "$skill_file" | cut -d ' ' -f 1)"
              test "$before" != "$mutated"
              npx --yes skills@1.5.19 update -p -y supertoken-gpt-image-2
              after="$(sha256sum "$skill_file" | cut -d ' ' -f 1)"
              test "$before" = "$after"
              if [[ "$profile" == "shared" ]]; then
                test "$(sha256sum "$claude_dir/SKILL.md" | cut -d ' ' -f 1)" = "$before"
              fi
            done
            mark_global_update_available() {
              HOME_DIR="$1" python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["HOME_DIR"]) / ".agents" / ".skill-lock.json"
          lock = json.loads(path.read_text(encoding="utf-8"))
          lock["skills"]["supertoken-gpt-image-2"]["skillFolderHash"] = "0" * 40
          path.write_text(json.dumps(lock, indent=2) + "\n", encoding="utf-8")
          PY
            }
            for profile in codex shared; do
              home="$RUNNER_TEMP/global-${profile}-home"
              project="$RUNNER_TEMP/global-${profile}-project"
              neutral="$RUNNER_TEMP/global-${profile}-neutral"
              mkdir -p "$home" "$project" "$neutral"
              agents=(codex)
              if [[ "$profile" == "shared" ]]; then
                agents=(codex claude-code)
              fi
              cd "$project"
              HOME="$home" npx --yes skills@1.5.19 add "supertoken2026/skills" \
                --skill supertoken-gpt-image-2 \
                --agent "${agents[@]}" \
                --global \
                --yes
              HOME="$home" npx --yes skills@1.5.19 list -g --json > skills-list.json
              skill_dir="$(python - <<'PY'
          import json
          from pathlib import Path

          listed = json.loads(Path("skills-list.json").read_text(encoding="utf-8"))
          matches = [item for item in listed if item["name"] == "supertoken-gpt-image-2"]
          assert len(matches) == 1, listed
          print(Path(matches[0]["path"]).resolve())
          PY
              )"
              skill_file="$skill_dir/SKILL.md"
              test -f "$skill_file"
              if [[ "$profile" == "shared" ]]; then
                claude_dir="$home/.claude/skills/supertoken-gpt-image-2"
                test -L "$claude_dir"
                test "$(realpath "$claude_dir")" = "$skill_dir"
              fi
              before="$(sha256sum "$skill_file" | cut -d ' ' -f 1)"
              printf '\n<!-- global-update-smoke -->\n' >> "$skill_file"
              mutated="$(sha256sum "$skill_file" | cut -d ' ' -f 1)"
              test "$before" != "$mutated"
              mark_global_update_available "$home"
              HOME="$home" npx --yes skills@1.5.19 update -g -y supertoken-gpt-image-2
              after="$(sha256sum "$skill_file" | cut -d ' ' -f 1)"
              test "$before" = "$after"
              printf '\n<!-- default-update-smoke -->\n' >> "$skill_file"
              mutated="$(sha256sum "$skill_file" | cut -d ' ' -f 1)"
              test "$before" != "$mutated"
              mark_global_update_available "$home"
              cd "$neutral"
              HOME="$home" npx --yes skills@1.5.19 update -y supertoken-gpt-image-2
              after="$(sha256sum "$skill_file" | cut -d ' ' -f 1)"
              test "$before" = "$after"
              if [[ "$profile" == "shared" ]]; then
                test "$(sha256sum "$claude_dir/SKILL.md" | cut -d ' ' -f 1)" = "$before"
              fi
            done
          fi
